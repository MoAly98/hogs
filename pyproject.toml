[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hogs"
version = "0.1.0"
description = "Rank the processes hogging CPU, memory and energy on macOS, in the terminal or a live browser view."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hogs = "hogs.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
